<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- ★iPad Safariでホーム画面に追加した際にフルスクリーン(ツールバー非表示)にする設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="深海音響水槽">
  
  <title>画音共鳴 - 深海音響水槽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap');
    
    html, body {
      width: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      touch-action: none; /* ★OS標準のズームやスクロールを無効化 */
      -webkit-touch-callout: none; /* 長押しメニュー無効化 */
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Zen Kaku Gothic New', sans-serif;
    }

    .glow-effect {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
    }
    
    .glass-panel {
      background: rgba(10, 25, 47, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    #drawCanvas {
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body class="w-screen h-[100dvh] relative bg-slate-950 text-slate-100 overflow-hidden">

  <!-- オーディオ有効化用の最前面モーダル -->
  <div id="audioStartModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-md cursor-pointer">
    <div class="glass-panel p-6 md:p-8 rounded-3xl max-w-md w-full text-center shadow-2xl">

      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-2 text-cyan-100">音響空間を開始</h2>
      <p class="text-xs md:text-sm text-slate-300 mb-6">画面をタップして水槽に入ります。</p>
      <button id="startAudioBtn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-2xl shadow-lg glow-effect">
        水槽に入る（音声を有効化）
      </button>
    </div>
  </div>

  <!-- メイン水槽スクリーン -->
  <div id="canvasContainer" class="absolute inset-0 w-full h-full overflow-hidden bg-slate-950 flex items-center justify-center">
    <canvas id="aquariumCanvas" class="block"></canvas>
  </div>

  <!-- UI: ヘッダー (情報表示) -->

    <div class="glass-panel px-3 py-1.5 md:px-4 md:py-2 rounded-xl pointer-events-auto text-[10px] md:text-xs flex gap-2 md:gap-4 text-cyan-200/80">
      <div><i class="fa-solid fa-fish text-cyan-400 mr-1"></i> 生物: <span id="creatureCount" class="font-bold text-white">0</span></div>
      <div><i class="fa-solid fa-circle-dot text-indigo-400 mr-1"></i> 泡: <span id="bubbleCount" class="font-bold text-white">0</span></div>
    </div>
  </header>

  <!-- UI: 環境コントロールパネル -->
  <div id="envControlsPanel" class="absolute bottom-4 left-4 md:bottom-8 md:left-8 z-30 glass-panel p-4 rounded-3xl w-64 md:w-72 flex flex-col gap-2 transition-all duration-300 shadow-lg">
    <div class="flex justify-between items-center text-sm md:text-base text-cyan-300 font-bold cursor-pointer" id="toggleEnvBtn">
      <span class="flex items-center gap-2" id="envTitle"><i class="fa-solid fa-gamepad"></i> あそぶ</span>
      <i class="fa-solid fa-chevron-down w-8 h-8 flex items-center justify-center bg-cyan-500/20 rounded-lg transition-transform" id="envToggleIcon"></i>
    </div>
    <div id="envControlsBody" class="flex flex-col gap-3 mt-2">
      <button id="addBubbleBtn" class="w-full py-4 bg-slate-800/80 hover:bg-cyan-500/40 text-cyan-100 rounded-2xl text-lg font-bold border-2 border-cyan-500/40 shadow-lg transition-transform hover:scale-105 active:scale-95 flex items-center justify-center gap-3">
        <i class="fa-solid fa-soap text-2xl text-cyan-400"></i> あわをだす
      </button>
      <button id="addFoodBtn" class="w-full py-4 bg-slate-800/80 hover:bg-amber-400/40 text-amber-100 rounded-2xl text-lg font-bold border-2 border-amber-500/40 shadow-lg transition-transform hover:scale-105 active:scale-95 flex items-center justify-center gap-3">
        <i class="fa-solid fa-cookie-bite text-2xl text-amber-400"></i> えさをあげる
      </button>
    </div>
  </div>

  <!-- UI: お絵かきウィンドウ起動FAB -->
  <button id="openPaletteFab" class="absolute bottom-4 right-4 md:bottom-8 md:right-8 z-30 w-14 h-14 md:w-16 md:h-16 bg-gradient-to-r from-teal-400 to-cyan-500 rounded-full shadow-[0_0_20px_rgba(34,211,238,0.4)] flex items-center justify-center text-slate-950 transition-transform hover:scale-110 active:scale-95">
    <i class="fa-solid fa-paintbrush text-xl md:text-2xl"></i>
  </button>

  <!-- UI: 全画面お絵かきモーダル -->
  <div id="paletteModal" class="fixed inset-2 md:inset-8 z-40 glass-panel rounded-3xl flex flex-col shadow-2xl transition-all duration-300 hidden opacity-0 scale-95">
    <!-- パレットヘッダー -->
    <div class="flex justify-between items-center p-3 md:p-5 border-b border-cyan-500/20">
      <span class="text-sm md:text-lg font-bold text-cyan-200 flex items-center gap-2">
        <i class="fa-solid fa-pen-nib text-cyan-400"></i> 生き物を描く
      </span>
      <div class="flex gap-3 items-center">
        <button id="clearDrawBtn" class="text-xs md:text-sm text-slate-400 hover:text-rose-400 transition-colors">
          <i class="fa-solid fa-trash-can"></i> クリア
        </button>
        <button id="closePaletteBtn" class="w-8 h-8 md:w-10 md:h-10 bg-slate-800 hover:bg-rose-500/80 text-white rounded-full flex items-center justify-center transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- キャンバス領域 -->
    <div class="flex-1 relative w-full p-2 md:p-5">
      <div class="w-full h-full bg-slate-900/90 rounded-2xl border border-cyan-500/30 overflow-hidden relative shadow-inner">
        <canvas id="drawCanvas" class="w-full h-full block"></canvas>
        <div id="drawPlaceholder" class="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-500 text-xs md:text-sm">
          ここをなぞって線を描いたり、タップして点を打てます
        </div>
      </div>
    </div>

    <!-- ツールバー (色・太さ・放流) -->
    <div class="p-3 md:p-5 flex flex-col md:flex-row items-center justify-between gap-3 bg-slate-900/60 rounded-b-3xl border-t border-cyan-500/20">
      
      <!-- 拡充されたカラーパレット (16色) -->
      <div class="flex flex-wrap justify-center items-center gap-2 bg-slate-800/80 p-2 rounded-xl border border-slate-700 w-full md:w-auto">
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-cyan-400 border-2 border-white scale-110 shadow-sm" data-color="#22d3ee"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-blue-400 border-2 border-transparent shadow-sm" data-color="#60a5fa"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-indigo-400 border-2 border-transparent shadow-sm" data-color="#818cf8"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-purple-400 border-2 border-transparent shadow-sm" data-color="#c084fc"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-fuchsia-400 border-2 border-transparent shadow-sm" data-color="#e879f9"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-pink-400 border-2 border-transparent shadow-sm" data-color="#f472b6"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-rose-400 border-2 border-transparent shadow-sm" data-color="#fb7185"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-red-400 border-2 border-transparent shadow-sm" data-color="#f87171"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-orange-400 border-2 border-transparent shadow-sm" data-color="#fb923c"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-amber-300 border-2 border-transparent shadow-sm" data-color="#fcd34d"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-yellow-300 border-2 border-transparent shadow-sm" data-color="#fde047"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-lime-400 border-2 border-transparent shadow-sm" data-color="#a3e635"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-green-400 border-2 border-transparent shadow-sm" data-color="#4ade80"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-emerald-400 border-2 border-transparent shadow-sm" data-color="#34d399"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-teal-400 border-2 border-transparent shadow-sm" data-color="#2dd4bf"></button>
        <button class="color-btn w-6 h-6 md:w-8 md:h-8 rounded-full bg-white border-2 border-transparent shadow-sm" data-color="#ffffff"></button>
      </div>

      <div class="flex items-center gap-3 w-full md:w-auto">
        <!-- 太さ選択 -->
        <div class="flex items-center justify-center gap-4 bg-slate-800/80 p-2 rounded-xl border border-slate-700 flex-1 md:flex-none">
          <button class="size-btn flex items-center justify-center w-8 h-8" data-size="4">
            <span class="block bg-slate-500 rounded-full pointer-events-none" style="width: 6px; height: 6px;"></span>
          </button>
          <button class="size-btn flex items-center justify-center w-8 h-8" data-size="8">
            <span class="block bg-white rounded-full pointer-events-none shadow-[0_0_5px_#22d3ee]" style="width: 12px; height: 12px;"></span>
          </button>
          <button class="size-btn flex items-center justify-center w-8 h-8" data-size="16">
            <span class="block bg-slate-500 rounded-full pointer-events-none" style="width: 20px; height: 20px;"></span>
          </button>
        </div>
        <!-- 放流ボタン -->
        <button id="spawnBtn" class="flex-1 md:flex-none py-3 px-6 bg-gradient-to-r from-teal-400 to-cyan-500 hover:from-teal-300 hover:to-cyan-400 text-slate-950 font-black rounded-xl text-sm md:text-base shadow-lg transition-transform hover:scale-105 flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> 放流する
        </button>
      </div>
    </div>
  </div>

  <script>
    // ★追加: iPad Safariのピンチズーム・ダブルタップズームをJavaScriptレイヤーで強制ブロック
    document.addEventListener('touchstart', function(event) {
      if (event.touches.length > 1) {
        event.preventDefault(); // ピンチズーム無効化
      }
    }, { passive: false });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(event) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault(); // ダブルタップズーム無効化
      }
      lastTouchEnd = now;
    }, { passive: false });
    
    // ★追加: ダブルクリックの無効化（念のためPCマウス操作時用）
    document.addEventListener('dblclick', function(e) {
      e.preventDefault();
    }, { passive: false });

    // --- 音響エンジン (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.scale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
        this.initialized = false;
      }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.initialized) return;
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.3;
        const convolver = this.ctx.createConvolver();
        const rate = this.ctx.sampleRate, length = rate * 2.5;
        const impulse = this.ctx.createBuffer(2, length, rate);
        for (let i = 0; i < 2; i++) {
          const channel = impulse.getChannelData(i);
          for (let j = 0; j < length; j++) channel[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 2.0);
        }
        convolver.buffer = impulse;
        this.masterGain.connect(convolver);
        convolver.connect(this.ctx.destination);
        this.masterGain.connect(this.ctx.destination);
        this.initialized = true;
      }
      playImpactSound(size, colorHex) {
        if (!this.initialized || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        const sizeRatio = Math.max(0, Math.min(1, 1 - (size - 15) / 80));
        const baseIndex = Math.floor(sizeRatio * (this.scale.length - 4));
        const noteIndex = baseIndex + (this.hashCode(colorHex) % 4);
        osc.frequency.setValueAtTime(this.scale[noteIndex] || 440, now);
        osc.type = ['sine', 'triangle'][Math.abs(this.hashCode(colorHex)) % 2];
        const attack = 0.02, decay = 0.3 + (size / 50) * 0.4;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + attack + decay + 0.1);
      }
      playBubblePopSound(radius) {
        if (!this.initialized || !this.ctx) return;
        const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(400 + (30 - Math.min(radius, 25)) * 30, now);
        osc.frequency.exponentialRampToValueAtTime(osc.frequency.value + 300, now + 0.04);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + 0.06);
      }
      playEatSound() {
        if (!this.initialized || !this.ctx) return;
        const now = this.ctx.currentTime, osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + 0.15);
      }
      hashCode(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) hash = (hash << 5) - hash + str.charCodeAt(i);
        return Math.abs(hash);
      }
    }
    const sound = new SoundEngine();

    // --- メインアプリ管理 ---
    const aquariumCanvas = document.getElementById('aquariumCanvas');
    const ctx = aquariumCanvas.getContext('2d');
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');

    let creatures = [], bubbles = [], particles = [], foods = [];
    let worldWidth = 1920, worldHeight = 1080;
    const BASE_WORLD_WIDTH = 1920, BASE_WORLD_HEIGHT = 1080;
    let currentCameraZoom = 1.0;

    // --- お絵かき関連 ---
    let currentStrokes = [];
    let currentPath = [];
    let isDrawing = false;
    let currentColor = '#22d3ee';
    let currentBrushSize = 8;

    function transformToOceanGlow(hexColor) {
      const map = {
        '#22d3ee': { inner: '#67e8f9', outer: 'rgba(34, 211, 238, 0.8)' },
        '#60a5fa': { inner: '#93c5fd', outer: 'rgba(96, 165, 250, 0.8)' },
        '#818cf8': { inner: '#a5b4fc', outer: 'rgba(129, 140, 248, 0.8)' },
        '#c084fc': { inner: '#e9d5ff', outer: 'rgba(192, 132, 252, 0.8)' },
        '#e879f9': { inner: '#f0abfc', outer: 'rgba(232, 121, 249, 0.8)' },
        '#f472b6': { inner: '#f9a8d4', outer: 'rgba(244, 114, 182, 0.8)' },
        '#fb7185': { inner: '#fecdd3', outer: 'rgba(251, 113, 133, 0.8)' },
        '#f87171': { inner: '#fca5a5', outer: 'rgba(248, 113, 113, 0.8)' },
        '#fb923c': { inner: '#fdba74', outer: 'rgba(251, 146, 60, 0.8)' },
        '#fcd34d': { inner: '#fef3c7', outer: 'rgba(252, 211, 77, 0.8)' },
        '#fde047': { inner: '#fef08a', outer: 'rgba(253, 224, 71, 0.8)' },
        '#a3e635': { inner: '#bef264', outer: 'rgba(163, 230, 53, 0.8)' },
        '#4ade80': { inner: '#86efac', outer: 'rgba(74, 222, 128, 0.8)' },
        '#34d399': { inner: '#6ee7b7', outer: 'rgba(52, 211, 153, 0.8)' },
        '#2dd4bf': { inner: '#5eead4', outer: 'rgba(45, 212, 191, 0.8)' },
        '#ffffff': { inner: '#ffffff', outer: 'rgba(255, 255, 255, 0.8)' }
      };
      return map[hexColor] || { inner: '#ffffff', outer: `rgba(255,255,255,0.8)` };
    }

    function initDrawCanvas() {
      const setSize = () => {
        const rect = drawCanvas.parentElement.getBoundingClientRect();
        drawCanvas.width = rect.width;
        drawCanvas.height = rect.height;
        redrawUserCanvas();
      };
      window.addEventListener('resize', setSize);

      const getPos = (e) => {
        const rect = drawCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      };

      const start = (e) => {
        isDrawing = true;
        document.getElementById('drawPlaceholder').style.display = 'none';
        currentPath = [getPos(e)];
        drawCurrentPath();
      };
      const move = (e) => {
        if (!isDrawing) return;
        currentPath.push(getPos(e));
        redrawUserCanvas();
        drawCurrentPath();
      };
      const end = () => {
        if (isDrawing) {
          isDrawing = false;
          if (currentPath.length >= 1) {
            currentStrokes.push({ path: currentPath, color: currentColor, size: currentBrushSize });
          }
          currentPath = [];
          redrawUserCanvas();
        }
      };

      drawCanvas.addEventListener('mousedown', start);
      drawCanvas.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
      drawCanvas.addEventListener('touchstart', e => { e.preventDefault(); start(e); }, { passive: false });
      drawCanvas.addEventListener('touchmove', e => { e.preventDefault(); move(e); }, { passive: false });
      window.addEventListener('touchend', end);
    }

    function drawSingleStroke(ctx, strokeData) {
      const { path, color, size } = strokeData;
      if (path.length === 0) return;
      ctx.save();
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = color; ctx.shadowBlur = 10;
      ctx.beginPath();
      if (path.length === 1) { 
        ctx.arc(path[0].x, path[0].y, size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function redrawUserCanvas() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      currentStrokes.forEach(s => drawSingleStroke(drawCtx, s));
    }
    function drawCurrentPath() {
      if (currentPath.length > 0) drawSingleStroke(drawCtx, { path: currentPath, color: currentColor, size: currentBrushSize });
    }

    class Creature {
      constructor(strokesData) {
        this.strokes = strokesData;
        this.rawColor = strokesData.length > 0 ? strokesData[0].color : '#22d3ee';
        this.lastSoundTime = 0;
        this.eatTimer = 0; 

        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        strokesData.forEach(s => s.path.forEach(pt => {
          if (pt.x < minX) minX = pt.x; if (pt.x > maxX) maxX = pt.x;
          if (pt.y < minY) minY = pt.y; if (pt.y > maxY) maxY = pt.y;
        }));
        if (minX === Infinity) { minX=0; maxX=10; minY=0; maxY=10; } 
        
        let rawWidth = Math.max(20, maxX - minX);
        let rawHeight = Math.max(20, maxY - minY);
        
        const MAX_SIZE = 90;
        const scale = Math.min(1.0, MAX_SIZE / Math.max(rawWidth, rawHeight));
        
        this.width = rawWidth * scale;
        this.height = rawHeight * scale;
        this.radius = Math.max(15, Math.hypot(this.width, this.height) / 2);
        
        const cx = minX + rawWidth/2;
        const cy = minY + rawHeight/2;

        this.baseSpeed = 2.5 + Math.random() * 3.5;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * this.baseSpeed;
        this.vy = Math.sin(angle) * this.baseSpeed;

        this.x = (Math.random() - 0.5) * (worldWidth * 0.7);
        this.y = (Math.random() - 0.5) * (worldHeight * 0.7);
        this.phase = Math.random() * Math.PI * 2;
        this.mass = this.radius;

        const pad = 20; 
        this.cWidth = this.width + pad * 2;
        this.cHeight = this.height + pad * 2;
        this.cacheCanvas = document.createElement('canvas');
        this.cacheCanvas.width = this.cWidth;
        this.cacheCanvas.height = this.cHeight;
        const ccCtx = this.cacheCanvas.getContext('2d');
        ccCtx.lineCap = 'round'; ccCtx.lineJoin = 'round';

        strokesData.forEach(s => {
          const style = transformToOceanGlow(s.color);
          const drawPath = (isInner) => {
            ccCtx.beginPath();
            ccCtx.strokeStyle = isInner ? style.inner : style.outer;
            ccCtx.fillStyle = isInner ? style.inner : style.outer;
            
            let scaledSize = s.size * scale;
            ccCtx.lineWidth = isInner ? Math.max(2, scaledSize - 3) : Math.max(4, scaledSize + 4);
            
            ccCtx.shadowBlur = isInner ? 0 : 15;
            ccCtx.shadowColor = style.outer;
            
            if (s.path.length === 1) { 
              const px = (s.path[0].x - cx) * scale + this.cWidth/2;
              const py = (s.path[0].y - cy) * scale + this.cHeight/2;
              ccCtx.arc(px, py, ccCtx.lineWidth/2, 0, Math.PI*2);
              ccCtx.fill();
            } else { 
              s.path.forEach((pt, i) => {
                const px = (pt.x - cx) * scale + this.cWidth/2;
                const py = (pt.y - cy) * scale + this.cHeight/2;
                if (i === 0) ccCtx.moveTo(px, py); else ccCtx.lineTo(px, py);
              });
              ccCtx.stroke();
            }
          };
          drawPath(false); 
          drawPath(true);  
        });
      }

      update() {
        let targetFood = null;
        let minDist = 400; 
        foods.forEach(f => {
          if (f.eaten) return;
          const d = Math.hypot(f.x - this.x, f.y - this.y);
          if (d < minDist) { minDist = d; targetFood = f; }
        });

        if (targetFood) {
          const dx = targetFood.x - this.x;
          const dy = targetFood.y - this.y;
          const angle = Math.atan2(dy, dx);
          this.vx = this.vx * 0.94 + Math.cos(angle) * 0.4;
          this.vy = this.vy * 0.94 + Math.sin(angle) * 0.4;
          
          if (minDist < this.radius + targetFood.radius + 10) {
            targetFood.eaten = true;
            this.eatTimer = 1.0; 
            sound.playEatSound();
            createImpactSparks(targetFood.x, targetFood.y, '#fde047', 8);
          }
        } else {
          const currentSpeed = Math.hypot(this.vx, this.vy);
          if (currentSpeed > 0.1) {
            this.vx = (this.vx / currentSpeed) * (currentSpeed * 0.98 + this.baseSpeed * 0.02);
            this.vy = (this.vy / currentSpeed) * (currentSpeed * 0.98 + this.baseSpeed * 0.02);
          }
        }

        this.x += this.vx; this.y += this.vy;
        this.phase += 0.05;

        const halfW = worldWidth / 2, halfH = worldHeight / 2;
        let hit = false;
        if (this.x - this.radius < -halfW) { this.x = -halfW + this.radius; this.vx *= -1; hit = true; }
        if (this.x + this.radius > halfW) { this.x = halfW - this.radius; this.vx *= -1; hit = true; }
        if (this.y - this.radius < -halfH) { this.y = -halfH + this.radius; this.vy *= -1; hit = true; }
        if (this.y + this.radius > halfH) { this.y = halfH - this.radius; this.vy *= -1; hit = true; }

        if (hit) {
          const now = Date.now();
          if (now - this.lastSoundTime > 200) {
            sound.playImpactSound(this.radius, this.rawColor);
            this.lastSoundTime = now;
          }
          createImpactSparks(this.x, this.y, transformToOceanGlow(this.rawColor).inner);
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.vx * 0.03) + Math.sin(this.phase * 2) * 0.1);

        let eatScale = 1.0;
        if (this.eatTimer > 0) {
          eatScale = 1.0 + Math.sin(this.eatTimer * Math.PI) * 0.3;
          this.eatTimer -= 0.05;
        }

        const swimPulse = Math.sin(this.phase * 3) * 0.05;
        ctx.scale((1 + swimPulse) * eatScale, (1 - swimPulse) * eatScale);
        
        ctx.drawImage(this.cacheCanvas, -this.cWidth/2, -this.cHeight/2);
        ctx.restore();
      }
    }

    class Food {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.vy = 1.5 + Math.random() * 1.5;
        this.radius = 5;
        this.eaten = false;
      }
      update() {
        this.y += this.vy;
        if (this.y > worldHeight / 2 + 50) this.eaten = true;
      }
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#fde047';
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.restore();
      }
    }

    class Bubble {
      constructor() {
        this.radius = 5 + Math.random() * 15;
        this.x = (Math.random() - 0.5) * (worldWidth * 0.9);
        this.y = worldHeight / 2 + this.radius + 20;
        this.vy = -(1.5 + Math.random() * 2.5);
        this.phase = Math.random() * Math.PI * 2;
        this.popped = false;
      }
      update() {
        this.phase += 0.05;
        this.x += Math.sin(this.phase) * 1.5;
        this.y += this.vy;
        if (this.y < -worldHeight / 2) this.pop();
      }
      pop() {
        if (this.popped) return;
        this.popped = true;
        sound.playBubblePopSound(this.radius);
        createImpactSparks(this.x, this.y, '#67e8f9', 6);
      }
      
      draw(ctx) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        ctx.fillStyle = 'rgba(165, 243, 252, 0.15)';
        ctx.fill();
        
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(165, 243, 252, 0.8)';
        ctx.shadowColor = '#67e8f9';
        ctx.shadowBlur = 12;
        ctx.stroke();
        
        ctx.restore();
      }
    }

    function createImpactSparks(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2, speed = 1 + Math.random() * 5;
        particles.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          color, life: 1.0, decay: 0.02 + Math.random() * 0.04, size: 2 + Math.random() * 3
        });
      }
    }

    function handleCollisions() {
      for (let i = 0; i < creatures.length; i++) {
        for (let j = i + 1; j < creatures.length; j++) {
          const c1 = creatures[i], c2 = creatures[j];
          
          if (Math.abs(c1.x - c2.x) > c1.radius + c2.radius) continue;
          if (Math.abs(c1.y - c2.y) > c1.radius + c2.radius) continue;

          const dx = c2.x - c1.x, dy = c2.y - c1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = c1.radius + c2.radius;
          if (dist < minDist) {
            const overlap = minDist - dist;
            const nx = dx / (dist || 1), ny = dy / (dist || 1);
            c1.x -= nx * overlap * 0.5; c1.y -= ny * overlap * 0.5;
            c2.x += nx * overlap * 0.5; c2.y += ny * overlap * 0.5;
            const kx = c1.vx - c2.vx, ky = c1.vy - c2.vy;
            const p = 2 * (nx * kx + ny * ky) / (c1.mass + c2.mass);
            c1.vx -= p * c2.mass * nx; c1.vy -= p * c2.mass * ny;
            c2.vx += p * c1.mass * nx; c2.vy += p * c1.mass * ny;
            const now = Date.now();
            if (now - c1.lastSoundTime > 200) {
              sound.playImpactSound((c1.radius + c2.radius)/2, c1.rawColor);
              c1.lastSoundTime = c2.lastSoundTime = now;
            }
          }
        }
      }
    }

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      aquariumCanvas.width = w; aquariumCanvas.height = h;
    }
    window.addEventListener('resize', resize);

    function render() {
      ctx.clearRect(0, 0, aquariumCanvas.width, aquariumCanvas.height);
      const w = aquariumCanvas.width, h = aquariumCanvas.height;
      
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#06152d'); bgGrad.addColorStop(1, '#020611');
      ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, w, h);

      let targetZoom = 1.0;
      if (creatures.length > 5) {
        targetZoom = Math.max(0.6, 1.0 - (creatures.length - 5) * 0.02);
      }
      
      currentCameraZoom += (targetZoom - currentCameraZoom) * 0.05;

      worldWidth = BASE_WORLD_WIDTH / currentCameraZoom;
      worldHeight = BASE_WORLD_HEIGHT / currentCameraZoom;

      ctx.save();
      ctx.translate(w / 2, h / 2);
      
      const viewScale = Math.min(w / BASE_WORLD_WIDTH, h / BASE_WORLD_HEIGHT) * currentCameraZoom;
      ctx.scale(viewScale, viewScale);

      handleCollisions();

      for (let i = foods.length - 1; i >= 0; i--) {
        foods[i].update();
        if (foods[i].eaten) {
          foods.splice(i, 1);
        } else {
          foods[i].draw(ctx);
        }
      }

      creatures.forEach(c => { c.update(); c.draw(ctx); });

      for (let i = bubbles.length - 1; i >= 0; i--) {
        bubbles[i].update();
        if (bubbles[i].popped) {
          bubbles.splice(i, 1);
        } else {
          bubbles[i].draw(ctx);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1.0;
      ctx.restore();

      document.getElementById('creatureCount').textContent = creatures.length;
      document.getElementById('bubbleCount').textContent = bubbles.length;

      requestAnimationFrame(render);
    }

    setInterval(() => { if (bubbles.length < 20) bubbles.push(new Bubble()); }, 1500);

    document.getElementById('startAudioBtn').addEventListener('click', (e) => {
      sound.init(); document.getElementById('audioStartModal').remove();
      resize(); initDrawCanvas();
      
      creatures.push(new Creature([{ path: [{x:40,y:50},{x:70,y:30},{x:110,y:50},{x:70,y:70},{x:40,y:50}], color: '#818cf8', size: 6 }]));
      creatures.push(new Creature([{ path: [{x:10,y:20},{x:30,y:10},{x:50,y:20},{x:30,y:30},{x:10,y:20}], color: '#34d399', size: 4 }]));
      creatures.push(new Creature([{ path: [{x:30,y:40},{x:60,y:20},{x:90,y:40},{x:110,y:60},{x:60,y:60},{x:30,y:40}], color: '#fcd34d', size: 8 }]));
      creatures.push(new Creature([
        { path: [{x:50,y:30},{x:70,y:20},{x:90,y:30},{x:90,y:50},{x:50,y:50},{x:50,y:30}], color: '#c084fc', size: 6 },
        { path: [{x:60,y:50},{x:60,y:80}], color: '#c084fc', size: 4 },
        { path: [{x:70,y:50},{x:70,y:85}], color: '#c084fc', size: 4 },
        { path: [{x:80,y:50},{x:80,y:80}], color: '#c084fc', size: 4 }
      ]));

      requestAnimationFrame(render);
    });

    const paletteModal = document.getElementById('paletteModal');
    document.getElementById('openPaletteFab').addEventListener('click', () => {
      paletteModal.classList.remove('hidden');
      setTimeout(() => {
        paletteModal.classList.remove('opacity-0', 'scale-95');
        const rect = drawCanvas.parentElement.getBoundingClientRect();
        drawCanvas.width = rect.width; drawCanvas.height = rect.height;
        redrawUserCanvas();
      }, 10);
    });
    
    document.getElementById('closePaletteBtn').addEventListener('click', () => {
      paletteModal.classList.add('opacity-0', 'scale-95');
      setTimeout(() => paletteModal.classList.add('hidden'), 300);
    });

    document.getElementById('clearDrawBtn').addEventListener('click', () => {
      currentStrokes = []; redrawUserCanvas();
      document.getElementById('drawPlaceholder').style.display = 'flex';
    });
    
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('border-white', 'scale-110'));
        e.target.classList.add('border-white', 'scale-110');
        currentColor = e.target.dataset.color;
      });
    });
    
    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const target = e.target.closest('.size-btn');
        document.querySelectorAll('.size-btn span').forEach(ind => {
          ind.classList.remove('bg-white', 'shadow-[0_0_5px_#22d3ee]');
          ind.classList.add('bg-slate-500');
        });
        const ind = target.querySelector('span');
        ind.classList.remove('bg-slate-500');
        ind.classList.add('bg-white', 'shadow-[0_0_5px_#22d3ee]');
        currentBrushSize = parseInt(target.dataset.size);
      });
    });
    
    document.getElementById('spawnBtn').addEventListener('click', () => {
      if (currentStrokes.length > 0) {
        creatures.push(new Creature(currentStrokes));
        sound.playImpactSound(30, currentStrokes[0].color);
        currentStrokes = []; redrawUserCanvas();
        document.getElementById('drawPlaceholder').style.display = 'flex';
        document.getElementById('closePaletteBtn').click();
      }
    });

    const envPanel = document.getElementById('envControlsPanel');
    const toggleEnvBtn = document.getElementById('toggleEnvBtn');
    const envBody = document.getElementById('envControlsBody');
    const envTitle = document.getElementById('envTitle');
    const envToggleIcon = document.getElementById('envToggleIcon');
    let isEnvOpen = true;

    toggleEnvBtn.addEventListener('click', () => {
      isEnvOpen = !isEnvOpen;
      envBody.style.display = isEnvOpen ? 'flex' : 'none';
      
      if (isEnvOpen) {
        envPanel.className = "absolute bottom-4 left-4 md:bottom-8 md:left-8 z-30 glass-panel p-4 rounded-3xl w-64 md:w-72 flex flex-col gap-2 transition-all duration-300 shadow-lg";
        envTitle.style.display = 'flex';
        envToggleIcon.className = "fa-solid fa-chevron-down w-8 h-8 flex items-center justify-center bg-cyan-500/20 rounded-lg transition-transform";
      } else {
        envPanel.className = "absolute bottom-4 left-4 md:bottom-8 md:left-8 z-30 glass-panel p-3 rounded-2xl w-auto flex flex-col gap-2 transition-all duration-300 opacity-60 hover:opacity-100 shadow-none";
        envTitle.style.display = 'none';
        envToggleIcon.className = "fa-solid fa-gamepad w-10 h-10 flex items-center justify-center bg-cyan-500/20 rounded-xl text-xl text-cyan-300 transition-transform";
      }
    });

    document.getElementById('addBubbleBtn').addEventListener('click', () => {
      for(let i = 0; i < 5; i++) bubbles.push(new Bubble());
    });
    
    document.getElementById('addFoodBtn').addEventListener('click', () => {
      for(let i = 0; i < 4; i++) {
        const fx = (Math.random() - 0.5) * (worldWidth * 0.8);
        const fy = -worldHeight / 2 - Math.random() * 100;
        foods.push(new Food(fx, fy));
      }
    });
  </script>
</body>
