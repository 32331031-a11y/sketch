<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画音共鳴 - 深海音響水槽 (16:9)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap');
    
    body {
      font-family: 'Zen Kaku Gothic New', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background-color: #030712;
    }

    .glow-effect {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2);
    }
    
    .glass-panel {
      background: rgba(10, 25, 47, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    #drawCanvas {
      cursor: crosshair;
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-slate-950 text-slate-100 flex flex-col justify-between">

  <!-- メイン水槽スクリーン (ワールドビュー) -->
  <div id="canvasContainer" class="absolute inset-0 w-full h-full overflow-hidden bg-slate-950 flex items-center justify-center">
    <canvas id="aquariumCanvas" class="block"></canvas>
  </div>

  <!-- UIオーバーレイ: ヘッダー/タイトル -->
  <header class="relative z-10 p-4 md:p-6 pointer-events-none flex justify-between items-start">
    <div class="glass-panel p-4 rounded-2xl pointer-events-auto max-w-sm">
      <h1 class="text-xl md:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 via-teal-200 to-indigo-300 flex items-center gap-2">
        <i class="fa-solid font-normal fa-water text-cyan-400"></i> 画音共鳴 - 深海音響水槽
      </h1>
      <p class="text-xs text-cyan-200/70 mt-1">
        16:9アスペクト比固定。描いた生き物が水槽へ泳ぎ出し、音を奏でます。絵が増えると水槽が自動でズームアウトします。
      </p>
    </div>

    <!-- ステータス表示 -->
    <div class="glass-panel px-4 py-2 rounded-xl pointer-events-auto text-xs flex gap-4 text-cyan-200/80">
      <div><i class="fa-solid fa-fish text-cyan-400 mr-1"></i> 生物数: <span id="creatureCount" class="font-bold text-white">0</span></div>
      <div><i class="fa-solid fa-expand text-teal-400 mr-1"></i> 水槽拡大率: <span id="zoomLevel" class="font-bold text-white">100%</span></div>
      <div><i class="fa-solid fa-[#38bdf8] fa-circle-dot text-indigo-400 mr-1"></i> 泡数: <span id="bubbleCount" class="font-bold text-white">0</span></div>
    </div>
  </header>

  <!-- オーディオ有効化用のモーダル -->
  <div id="audioStartModal" class="absolute inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md">
    <div class="glass-panel p-8 rounded-3xl max-w-md text-center border border-cyan-500/40 shadow-2xl">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-300 text-2xl animate-pulse">
        <i class="fa-solid fa-volume-high"></i>
      </div>
      <h2 class="text-2xl font-bold mb-2 text-cyan-100">音響空間を開始</h2>
      <p class="text-sm text-slate-300 mb-6">
        クリックして音響エンジンを初期化します。<br>水槽内の衝突や泡のはじける音が響きます。
      </p>
      <button id="startAudioBtn" class="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-2xl shadow-lg transition-all duration-300 transform hover:scale-105 active:scale-95 glow-effect">
        水槽に入る（音声を有効化）
      </button>
    </div>
  </div>

  <!-- UIオーバーレイ: お絵描きパレット & コントロール -->
  <footer class="relative z-10 p-4 md:p-6 pointer-events-none flex flex-col md:flex-row justify-between items-end gap-4">
    
    <!-- 左下: 音階スケール設定 -->
    <div class="glass-panel p-4 rounded-2xl pointer-events-auto w-full md:w-auto flex flex-col gap-2">
      <div class="text-xs text-cyan-300/80 font-bold flex items-center gap-1">
        <i class="fa-solid fa-sliders"></i> 音階スケール設定
      </div>
      <div class="flex gap-2">
        <button id="scalePentatonic" class="px-3 py-1.5 rounded-lg text-xs bg-cyan-500/30 border border-cyan-400 text-cyan-100 font-medium">ペンタトニック（和風・神秘）</button>
        <button id="scaleLydian" class="px-3 py-1.5 rounded-lg text-xs bg-slate-800/60 border border-slate-700 text-slate-400 font-medium hover:bg-slate-700/50">リディアン（浮遊感）</button>
        <button id="scaleOkinawa" class="px-3 py-1.5 rounded-lg text-xs bg-slate-800/60 border border-slate-700 text-slate-400 font-medium hover:bg-slate-700/50">琉球（透明感）</button>
      </div>
    </div>

    <!-- 右下: お絵描きパレット -->
    <div class="glass-panel p-4 rounded-3xl pointer-events-auto flex flex-col gap-3 w-full md:w-96 shadow-2xl">
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-cyan-200 flex items-center gap-1.5">
          <i class="fa-solid fa-pen-nib text-cyan-400"></i> 生き物を描く（重ね描き可）
        </span>
        <button id="clearDrawBtn" class="text-xs text-slate-400 hover:text-rose-400 transition-colors">
          <i class="fa-solid fa-trash-can"></i> クリア
        </button>
      </div>

      <!-- 描画キャンバス領域 -->
      <div class="relative w-full h-44 bg-slate-900/90 rounded-2xl border border-cyan-500/30 overflow-hidden shadow-inner">
        <canvas id="drawCanvas" class="w-full h-full block"></canvas>
        <div id="drawPlaceholder" class="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-500 text-xs">
          ここに自由に線を描いてください
        </div>
      </div>

      <!-- 筆の設定 & アクション -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-1 bg-slate-900/60 p-1.5 rounded-xl border border-slate-800">
          <button class="color-btn w-6 h-6 rounded-full bg-cyan-400 border-2 border-white scale-110" data-color="#22d3ee"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-emerald-400 border-2 border-transparent" data-color="#34d399"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-indigo-400 border-2 border-transparent" data-color="#818cf8"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-purple-400 border-2 border-transparent" data-color="#c084fc"></button>
          <button class="color-btn w-6 h-6 rounded-full bg-teal-200 border-2 border-transparent" data-color="#99f
